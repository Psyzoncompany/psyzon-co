<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Copa Psyzon - Escolha seu jogo">
    <title>Copa Psyzon — Escolher Jogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='2' y='26' font-size='28'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
</head>

<body>
    <div class="page-wrapper">
        <div class="container">

            <button class="btn-back" id="btn-back">&#8592; Voltar</button>

            <!-- Logo -->
            <div class="logo-block">
                <span class="trophy-icon">&#127942;</span>
                <h1 class="logo-title">COPA <span class="highlight">PSYZON</span></h1>
                <p class="logo-subtitle">Escolha seu jogo</p>
            </div>

            <!-- Game Grid -->
            <div class="game-grid" id="game-grid">
                <div class="game-card" data-game="fifa" id="game-fifa">
                    <span class="game-icon">&#9917;</span>
                    <span class="game-name">FIFA</span>
                    <span class="game-status active">Liberado</span>
                </div>
                <div class="game-card disabled" data-game="sinuca">
                    <span class="game-icon">&#127921;</span>
                    <span class="game-name">Sinuca</span>
                    <span class="game-status soon">Em breve</span>
                </div>
                <div class="game-card disabled" data-game="cs">
                    <span class="game-icon">&#127918;</span>
                    <span class="game-name">Counter Strike</span>
                    <span class="game-status soon">Em breve</span>
                </div>
            </div>

            <p class="text-center text-muted mt-4" style="font-size:0.8rem;">&copy; 2026 Psyzon Company</p>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/escolherjogo.js"></script>
</body>

</html>
